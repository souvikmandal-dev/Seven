<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <title>Seven — Personal AI Operating System</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #080b12;
            --surface: rgba(18, 24, 37, 0.82);
            --surface-soft: rgba(255, 255, 255, 0.035);
            --border: rgba(177, 197, 233, 0.12);
            --border-strong: rgba(117, 157, 255, 0.34);
            --text: #f3f6ff;
            --muted: #96a2bc;
            --accent: #85a9ff;
            --success: #79dfb6;
            --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text);
            font-family: var(--font);
            background:
                radial-gradient(circle at 17% 0%, rgba(94, 137, 255, 0.14), transparent 32rem),
                radial-gradient(circle at 83% 100%, rgba(74, 202, 178, 0.06), transparent 28rem),
                var(--background);
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            content: "";
            opacity: 0.22;
            background-image:
                linear-gradient(rgba(148, 173, 230, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 173, 230, 0.045) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: linear-gradient(to bottom, black, transparent 80%);
        }

        .app-shell {
            display: flex;
            width: min(100% - 32px, 1080px);
            min-height: 100vh;
            margin: 0 auto;
            padding: 28px 0 24px;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(145, 177, 255, 0.48);
            border-radius: 13px;
            color: #dce7ff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.06em;
            background: linear-gradient(145deg, rgba(140, 174, 255, 0.25), rgba(65, 96, 176, 0.12));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 30px rgba(93, 137, 255, 0.14);
        }

        .brand-copy h1,
        .brand-copy p {
            margin: 0;
        }

        .brand-copy h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.22em;
        }

        .brand-copy p {
            margin-top: 4px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #b9c6e1;
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(121, 223, 182, 0.1), 0 0 16px rgba(121, 223, 182, 0.72);
        }

        .chat-window {
            display: flex;
            flex: 1;
            min-height: 590px;
            overflow: hidden;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(23, 30, 45, 0.9), rgba(12, 16, 26, 0.88));
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px);
        }

        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 10, 17, 0.24);
        }

        .window-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .window-label::before {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            content: "";
            background: var(--accent);
            box-shadow: 0 0 14px var(--accent);
        }

        .preview-label {
            padding: 5px 9px;
            border: 1px solid rgba(150, 173, 225, 0.15);
            border-radius: 999px;
            color: #9eabc6;
            font-size: 10px;
            font-weight: 650;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.035);
        }

        .conversation {
            display: flex;
            overflow-y: auto;
            padding: clamp(28px, 5vw, 56px) clamp(18px, 6vw, 78px);
            flex: 1;
            flex-direction: column;
            gap: 22px;
            scroll-behavior: smooth;
        }

        .intro {
            display: flex;
            max-width: 620px;
            align-items: flex-start;
            gap: 14px;
        }

        .avatar {
            display: grid;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            place-items: center;
            border: 1px solid rgba(139, 171, 255, 0.38);
            border-radius: 11px;
            color: #d7e3ff;
            font-size: 13px;
            font-weight: 750;
            background: linear-gradient(145deg, rgba(125, 159, 255, 0.2), rgba(62, 92, 163, 0.16));
        }

        .message-meta {
            margin: 1px 0 8px;
            color: #c7d3ed;
            font-size: 12px;
            font-weight: 700;
        }

        .message-meta span {
            margin-left: 8px;
            color: #71809f;
            font-size: 10px;
            font-weight: 550;
        }

        .intro-text {
            margin: 0;
            color: #d4dced;
            font-size: clamp(16px, 2vw, 18px);
            line-height: 1.55;
            letter-spacing: -0.015em;
        }

        .intro-text strong {
            color: #fff;
            font-weight: 650;
        }

        .suggestion-row {
            display: flex;
            margin: -4px 0 0 48px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion {
            padding: 9px 12px;
            border: 1px solid rgba(154, 179, 235, 0.15);
            border-radius: 10px;
            color: #b7c5df;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            background: var(--surface-soft);
            transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
        }

        .suggestion:hover,
        .suggestion:focus-visible {
            border-color: var(--border-strong);
            outline: none;
            color: #edf3ff;
            background: rgba(112, 151, 255, 0.12);
            transform: translateY(-1px);
        }

        .message {
            display: flex;
            max-width: min(78%, 560px);
            flex-direction: column;
            gap: 5px;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.assistant,
        .message.system,
        .message.error {
            max-width: 500px;
            margin-left: 48px;
        }

        .message-bubble {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px 14px 14px 4px;
            color: #cfd8ea;
            font-size: 14px;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.035);
        }

        .user .message-bubble {
            border-color: rgba(117, 157, 255, 0.2);
            border-radius: 14px 14px 4px 14px;
            color: #edf3ff;
            background: linear-gradient(135deg, rgba(93, 132, 238, 0.38), rgba(70, 105, 195, 0.24));
        }

        .assistant .message-bubble {
            border-color: rgba(139, 171, 255, 0.22);
            color: #d8e3f8;
            background: rgba(117, 157, 255, 0.09);
        }

        .system .message-bubble {
            border-color: rgba(121, 223, 182, 0.16);
            color: #adc7ba;
            font-size: 12px;
            background: rgba(86, 170, 140, 0.06);
        }

        .error .message-bubble {
            border-color: rgba(237, 128, 128, 0.25);
            color: #edc3c3;
            font-size: 12px;
            background: rgba(196, 77, 77, 0.1);
        }

        .message-time {
            color: #70809e;
            font-size: 10px;
        }

        .composer-area {
            padding: 16px clamp(16px, 4vw, 30px) 18px;
            border-top: 1px solid var(--border);
            background: rgba(7, 10, 17, 0.32);
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 8px 8px 8px 15px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(2, 5, 10, 0.35);
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .composer:focus-within {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 4px rgba(96, 140, 255, 0.1), 0 0 24px rgba(82, 122, 234, 0.09);
        }

        textarea {
            width: 100%;
            min-height: 26px;
            max-height: 130px;
            padding: 5px 0;
            resize: none;
            border: 0;
            outline: 0;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            line-height: 1.45;
            background: transparent;
        }

        textarea::placeholder {
            color: #697793;
        }

        .send-button {
            display: grid;
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            place-items: center;
            border: 0;
            border-radius: 11px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(145deg, #7fa4ff, #527de5);
            box-shadow: 0 7px 18px rgba(74, 114, 222, 0.32);
            transition: filter 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .send-button:hover,
        .send-button:focus-visible {
            outline: none;
            filter: brightness(1.12);
            transform: translateY(-1px);
            box-shadow: 0 9px 22px rgba(74, 114, 222, 0.46);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
            box-shadow: none;
        }

        .send-button svg {
            width: 17px;
            height: 17px;
        }

        .composer-note {
            margin: 10px 3px 0;
            color: #6f7b94;
            font-size: 11px;
            line-height: 1.4;
        }

        .footer {
            padding-top: 16px;
            color: #65718a;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 620px) {
            .app-shell {
                width: min(100% - 20px, 1080px);
                padding-top: 16px;
            }

            .topbar {
                margin-bottom: 16px;
            }

            .status {
                font-size: 9px;
            }

            .chat-window {
                min-height: calc(100vh - 122px);
                border-radius: 19px;
            }

            .window-header {
                padding: 14px 15px;
            }

            .preview-label {
                font-size: 9px;
            }

            .conversation {
                padding: 32px 18px;
            }

            .suggestion-row,
            .message.system {
                margin-left: 0;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand" aria-label="Seven">
                <div class="brand-mark" aria-hidden="true">7</div>
                <div class="brand-copy">
                    <h1>SEVEN</h1>
                    <p>Personal AI Operating System</p>
                </div>
            </div>
            <div class="status"><span class="status-dot" aria-hidden="true"></span>System ready</div>
        </header>

        <section class="chat-window" aria-label="Seven conversation">
            <header class="window-header">
                <span class="window-label">Conversation</span>
                <span class="preview-label">Local connection</span>
            </header>

            <div class="conversation" id="conversation" aria-live="polite">
                <div class="intro">
                    <div class="avatar" aria-hidden="true">7</div>
                    <div>
                        <p class="message-meta">Seven <span>Online</span></p>
                        <p class="intro-text">Good evening, Master. <strong>What would you like to work on?</strong></p>
                    </div>
                </div>

                <div class="suggestion-row" aria-label="Suggested prompts">
                    <button class="suggestion" type="button" data-prompt="What time is it?">What time is it?</button>
                    <button class="suggestion" type="button" data-prompt="What can you do?">What can you do?</button>
                    <button class="suggestion" type="button" data-prompt="Help me plan today">Help me plan today</button>
                </div>
            </div>

            <div class="composer-area">
                <form class="composer" id="composer">
                    <textarea id="message-input" rows="1" placeholder="Talk to Seven..." aria-label="Message Seven"></textarea>
                    <button class="send-button" id="send-button" type="submit" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
                <p class="composer-note">Seven connects locally to this Mac.</p>
            </div>
        </section>

        <footer class="footer">Seven • Local-first personal assistant</footer>
    </main>

    <script>
        const composer = document.getElementById("composer");
        const input = document.getElementById("message-input");
        const conversation = document.getElementById("conversation");
        const suggestions = document.querySelectorAll(".suggestion");
        const sendButton = document.getElementById("send-button");

        function currentTime() {
            return new Intl.DateTimeFormat([], {
                hour: "numeric",
                minute: "2-digit"
            }).format(new Date());
        }

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = text;

            const time = document.createElement("span");
            time.className = "message-time";
            time.textContent = currentTime();

            message.append(bubble, time);
            conversation.append(message);
            conversation.scrollTop = conversation.scrollHeight;
        }

        function resizeInput() {
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 130)}px`;
        }

        function setSending(isSending) {
            input.disabled = isSending;
            sendButton.disabled = isSending;
            composer.setAttribute("aria-busy", String(isSending));
        }

        composer.addEventListener("submit", async (event) => {
            event.preventDefault();
            const text = input.value.trim();

            if (!text) {
                input.focus();
                return;
            }

            addMessage(text, "user");
            input.value = "";
            resizeInput();
            setSending(true);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: text })
                });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "Seven could not process that message.");
                }

                if (typeof payload.response !== "string") {
                    throw new Error("Seven returned an unexpected response.");
                }

                addMessage(payload.response.replace(/^Seven:\s*/, ""), "assistant");
            } catch (error) {
                addMessage(
                    error.message || "I could not reach Seven's local Python connection.",
                    "error"
                );
            } finally {
                setSending(false);
                input.focus();
            }
        });

        input.addEventListener("input", resizeInput);
        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                composer.requestSubmit();
            }
        });

        suggestions.forEach((suggestion) => {
            suggestion.addEventListener("click", () => {
                input.value = suggestion.dataset.prompt;
                resizeInput();
                input.focus();
            });
        });
    </script>
</body>
</html>
